<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar eventos</title>

    <link rel="stylesheet" href="assets/css/basic-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">

</head>
<body class="azulFondo df columna centerY">
    
    <header class="vh10 df centerY centerX w100 posAb">
        <div class="w90 df spaceb centerY">
            <img src="assets/imgs/logo-prueba.svg" alt="">
            <button class="sinBorde botonCeleste blanco ajuste-boton">Mis reservas</button>
        </div>
    </header>

    <main class="w100">

        <section class="banner-cine ajusteBanner posRel vh50 w100 df centerX">

            <div class="w90 fEnd df columna vh40">
                <h1 class="blanco fuente">Administrador</h1>
                <p class="grisClaro fuente">Agregá nuevos eventos</p>
            </div>

        </section>

        <section>

            <form action="">

                <!--EVENTO-->
                <label class="blanco" for="name">Nombre del evento</label>
                <input type="text" for="name">

                <label class="blanco" for="fecha">Fecha</label>
                <input type="datetime-local" for="fecha">

                <label class="blanco" for="duracion">Duración (en minutos)</label>
                <input type="number" for="duracion">

                <label class="blanco" for="precio">Precio ($ARS)</label>
                <input type="number" for="precio">

                <label class="blanco" for="capacidad">Capacidad del lugar</label>
                <input type="number" for="capacidad">

                <div>

                    <p class="blanco">Seleccione el tipo de evento</p>

                    <button id="botonPelicula">Película</button>
                    <button id="botonTeatro">Obra de teatro</button>
                    <button id="botonRecital">Recital</button>

                    <div id="formElegido"></div>

                    
                    
                    

                </div>

            </form>
        </section>

        <!--section para que aparezcan los eventos que agregamos-->
        <section></section>

    </main>

    <footer></footer>

    <script type="module" src="assets/js/admin.js"></script>

</body>
</html>
