<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar eventos</title>

    <link rel="stylesheet" href="assets/css/basic-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/imgs/logo.png" type="image/x-icon">

</head>
<body class="azulFondo df columna centerY">
    
    <header class="vh10 df centerY centerX w100 posAb">
        <div class="w90 df spaceb centerY">
            <img src="assets/imgs/logo-prueba.svg" alt="">
            <button class="sinBorde botonCeleste blanco ajuste-boton">Mis reservas</button>
        </div>
    </header>

    <main class="w100 df columna centerY">

        <section class="banner-cine ajusteBanner posRel vh50 w100 df centerX">

            <div class="w90 fEnd df columna vh40">
                <h1 class="blanco fuente">Administrador</h1>
                <p class="grisClaro fuente">Agregá nuevos eventos</p>
            </div>

        </section>

        <section class="w100 df columna centerY mt4">

            <h3 class="blanco">Completá los datos sobre tu evento</h3>

            <form action="" class="w50 vh70 df columna spacea mt1">

                <!--EVENTO-->
                <label class="w100 grisClaro" for="nombre">Nombre del evento</label>
                <input class="w100" type="text" name="nombre" id="nombre">

                <div class="df spaceb">

                    <div class="df columna w45">
                        <label class="grisClaro" for="fecha">Fecha</label>
                        <input type="datetime-local" name="fecha" id="fecha">
                    </div>

                    <div class="df columna w45">
                        <label class="grisClaro" for="duracion">Duración (en minutos)</label>
                        <input type="number" name="duracion" id="duracion">
                    </div>
                     
                    
                </div>

                

                <label class="grisClaro" for="precio">Precio ($ARS)</label>
                <input type="number" name="precio" id="precio">

                <label class="grisClaro" for="capacidad">Capacidad del lugar</label>
                <input type="number" name="capacidad" id="capacidad">

                <label class="grisClaro" for="imagen">Link de imagen de portada</label>
                <input type="text" name="imagen" id="imagen">

                <div>

                    <div class="vh10 df columna spacea">

                        <p class="blanco">Seleccione el tipo de evento</p>

                        <div class="df w40 spaceb">
                            <button id="botonPelicula" class="sinBorde fondoRojo blanco ajuste-boton">Película</button>
                            <button id="botonTeatro" class="sinBorde fondoVioleta blanco ajuste-boton">Obra de teatro</button>
                            <button id="botonRecital" class="sinBorde fondoCeleste blanco ajuste-boton">Recital</button>
                        </div>
                        
                    </div>

                    <div id="formElegido" class="df columna"></div>

                    <button id="carga-pelicula" class="invisible fondoRojo blanco sinBorde ajuste-boton mt1">Cargar Película</button>

                    <button id="carga-teatro" class="invisible fondoVioleta blanco sinBorde ajuste-boton mt1">Cargar Obra</button>

                    <button id="carga-recital" class="invisible fondoCeleste blanco sinBorde ajuste-boton mt1">Cargar Recital</button>
                    

                </div>

            </form>
        </section>

        <!--section para que aparezcan los eventos que agregamos-->
        <section class="w50 mt4">
            <h3 class="blanco">Eventos agregados</h3>
            <div id="eventos-agregados"class="df mt1 spacea wrap"></div>
        </section>

    </main>

    <footer class="w100 mt4">
        <h2>Tu portal de eventos audiovisuales</h2>
        <p>Descubrí lo mejor del cine, teatro y música en vivo.</p>
      
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="cine.html">Cine</a>
          <a href="teatro.html">Teatro</a>
          <a href="concierto.html">Recitales</a>
        </div>
      
        <p class="copyright mt4">&copy; 2025 EventosAV. Todos los derechos reservados.</p>
      </footer>

    <script type="module" src="assets/js/admin.js"></script>
    <script type="module" src="assets/js/app.js"></script>

</body>
</html>
