<!DOCTYPE html>
<html lang="en">
<head>

            </div>
        </header>
       
        <main class="w100">
            <section class="banner-teatro ajusteBanner posRel vh50 w100 df centerX a">

            <section class="df vh60 mt4">

                </aside>

                        <div id="muestra-info">
                            
                        </div>

        <footer></footer>
