<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro</title>
    
    <link rel="stylesheet" href="assets/css/basic-styles.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/imgs/logo.png" type="image/x-icon">

    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>

</head>

    <body class="azulFondo df columna centerY">

        <header class="vh10 df centerY centerX w100 posAb">
            <div class="w90 df spaceb centerY">
                <a href="index.html"><img src="assets/imgs/logo-blanco.png" id="logo" class="objCover" alt=""></a>
                <button class="sinBorde botonCeleste blanco ajuste-boton">Mis reservas</button>
            </div>
        </header>
       
        <main class="w100 df columna">

            <section class="banner-teatro ajusteBanner posRel vh50 w100 df centerX a">
    
                <div class="w90 fEnd df columna vh40">
                    <h1 class="blanco fuente">Obras de teatro</h1>
                    <p class="grisClaro fuente">Disfrutá de las mejores obras de teatro</p>
                </div>
    
            </section>

            <section class="df mt4 columna centerY centerX">
    
                <div id="contObras" class="w80 df spaceb wrap">
    
                    <dialog id="modalInfo" class="w40 vh60 sinBorde bordeRedondo w90m w60t">
    
                        <button id="boton-reservar" class="ajuste-boton sinBorde fondoCeleste blanco">Reservar</button>
    
                        <div id="muestra-info">
                            
                        </div>
                        
                    </dialog>
    
                </div>
                
            </section>
    
            <section id="caja-reservas" class="df columna fondoBlanco w40 invisible w100m w60t">
    
                <div class="df spaceb">
                    <h2 class="mt1">Mis reservas</h2>
    
                    <button id="close-lateral" class="fitContent fondoTransparente sinBorde">
                        <i class="fi fi-rr-circle-xmark closei"></i>
                    </button>
                </div>
    
                <p class="mt1" id="sinReservas">Aún no tienes reservas!</p>
    
                <div id="cont-reservas" class="df columna"></div>
    
                <div id="descuentoBox" class="w100 mt3 df spaceb centerY vh20 columna invisible">
    
                    <div id="descuentoElements" class="df centerY spaceb h100 w100">
                        <label for="codigoDescuento">Código de descuento:</label>
                        <input type="text" id="codigoDescuento" placeholder="xxxx" class="w20">
                        <button id="aplicarDescuento" class="ajuste-boton sinBorde fondoCeleste blanco">Aplicar descuento</button>
                    </div>
    
                    <a href="pantalla-final.html"><button class="ajuste-boton sinBorde fondoVioleta blanco mt1 mb5">Pagar</button></a>
    
                </div>
    
            </section>
    
            
            <dialog id="dialog-comida" categoria="teatro" class="w50 sinBorde bordeRedondo p1 w40m w60t">
    
                <button id="cerrar-comida" class="mt4"><i class="fi fi-rr-circle-xmark closei cerrar-comida"></i></button>
    
                <div id="contenedorComida" class="df wrap mt4 spaceb"></div>
    
            </dialog>
            
        </main>

        <footer class="w100 mt4">
            <h2>Tu portal de eventos audiovisuales</h2>
            <p>Descubrí lo mejor del cine, teatro y música en vivo.</p>
          
            <div class="footer-links">
              <a href="index.html">Home</a>
              <a href="cine.html">Cine</a>
              <a href="teatro.html">Teatro</a>
              <a href="concierto.html">Recitales</a>
            </div>
          
            <p class="copyright mt4">&copy; 2025 EventosAV. Todos los derechos reservados.</p>
        </footer>

        <script type="module" src="assets/js/script.js"></script>
        <script type="module" src="assets/js/app.js"></script>
    
</body>
</html>
